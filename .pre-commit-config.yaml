minimum_pre_commit_version: 3.2.0 # necessitated by Lucas-C's hooks
default_install_hook_types: [pre-commit, pre-push]
exclude: "thirdParty"
repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v20.1.8
    hooks:
      - id: clang-format
        types_or: [file]
        files: \.(cpp|def|h|cu|tpp|kernel|loader|unitless|hpp|param)$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [-b, dev]
      - id: check-merge-conflict
      - id: trailing-whitespace
        exclude_types: [markdown, rst]
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: mixed-line-ending
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: \.tpl$
      - id: pretty-format-json
        args:
          - "--autofix"
          - "--no-ensure-ascii"
          - "--no-sort-keys"
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-tabs
        types_or: [file]
        exclude_types: [rst, tex, tsv]
      - id: remove-tabs
        types_or: [file]
        exclude_types: [rst, tex, tsv]
      - id: forbid-crlf
      - id: remove-crlf
  - repo: local
    hooks:
      - id: check_cpp_code_style
        name: check_cpp_code_style
        entry: share/ci/check_cpp_code_style.sh
        language: system
        files: \.(cpp|def|h|cu|tpp|kernel|loader|unitless|hpp|param)$
        pass_filenames: false
        # This hook runs on all files which is why it feels a bit too heavy-weight
        # for running before every commit. The CI currently runs manually, so it's
        # still running there and can be run manually and pre-push on demand.
        # TODO: Adjust the script to take filenames, so that we can pass the
        # filenames and speed things up before commits.
        stages: [manual, pre-push]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.10
    hooks:
      # Run the linter.
      - id: ruff
        types_or: [python, pyi, jupyter]
        # Rule E721 is about using isinstance()
        # but lib/python/picongpu/pypicongpu/rendering/renderer.py
        # is strict about types. Could be solved locally but I think this is fine.
        args: [--fix, --ignore, E721]
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi, jupyter]
        args: ["--line-length", "120"]
  - repo: https://github.com/jumanjihouse/pre-commit-hooks
    rev: 3.0.0
    hooks:
      - id: require-ascii
        # Reasons for exclusion:
        # - rst files: This is documentation.
        # - CHANGELOG.md: Contains author names that might include special characters for correct spelling.
        # - .zenodo.json: Contains author names that might include special characters for correct spelling.
        # - unit_dimension.py: Contains theta as the symbol for temperature.
        # - TASK-*.md: multi-agent task coordination artifacts (review/response
        #   documents at the repo root, not part of any PR) that may contain
        #   non-ASCII characters and must be kept verbatim (TASK-03-REVIEW.md
        #   is committed as-is by the review team).
        exclude_types: [rst]
        exclude: CHANGELOG.md|.zenodo.json|lib/python/picongpu/picmi/particle_functor/unit_dimension.py|^TASK-.*\.md$
  - repo: https://github.com/BlankSpruce/gersemi
    rev: 0.22.1
    hooks:
      - id: gersemi
        args: [-c, --diff, --no-warn-about-unknown-commands]
      - id: gersemi
        args: [-i, --no-warn-about-unknown-commands]
  - repo: https://github.com/tox-dev/pyproject-fmt
    rev: "v2.5.0"
    hooks:
      - id: pyproject-fmt
        # The default is 3.13, which would strip the 3.14 classifier.
        args: ["--max-supported-python", "3.14"]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      # Strip outputs, execution counts and nbstripout's default metadata
      # keys (metadata.signature, metadata.widgets and the cell metadata
      # keys collapsed, ExecuteTime, execution, heading_collapsed, hidden,
      # scrolled), and normalize cell ids, so notebooks stay clean in git.
      # Top-level notebook keys and other metadata entries are not stripped:
      # the standard `kernelspec`/`language_info` entries that tools need to
      # open the notebook with the right kernel stay, and so would
      # editor/execution leftovers such as `metadata.vscode` or
      # `metadata.papermill` if a tool ever added them (a top-level
      # `orig_nbformat` is likewise left as-is). Decision: keep the default
      # key set for now - the committed example notebooks carry none of those
      # leftover keys; revisit with --extra-keys if papermill/nbval notebook
      # CI lands.
      #
      # What it does / does NOT do (review Q2): nbstripout is a commit-time
      # filter. The hook runs `nbstripout` on the notebooks being committed and
      # rewrites them in place; if a file is changed the commit is blocked and
      # the cleaned copy must be re-staged, so the committed blob carries no
      # output. It does NOT rewrite already-committed history: output that is
      # already in an earlier commit stays in history until that file is
      # committed again (a history rewrite is out of scope for a pre-commit
      # hook). The one-time reformat (803d142a4) already removed the output
      # that had previously been committed in preparingInsightData_example.
      - id: nbstripout
        types: [jupyter]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
      # Structural validation of every notebook against the official nbformat
      # v4 schema (review Q1). Both example notebooks are nbformat 4.5
      # (nbformat_minor == 5, every cell carries a unique `id`), so one fixed
      # schema validates them all: the official nbformat.v4 schema requires
      # nbformat_minor >= 5 and an `id` on every cell - exactly the 4.5
      # contract. It is fetched from the pinned nbformat 5.11.1 tag, the same
      # version the notebooks target (no vendored schema file in the repo).
      #
      # Accepted trade-off (raised with the reviewer): unlike the previous
      # local nbformat hook, duplicate cell ids are NOT rejected here - that
      # check is not expressible in JSON Schema. In practice it cannot bite:
      # nbstripout (above) rewrites every cell id to a unique sequential value
      # on each commit, so a committed notebook always carries unique ids.
      - id: check-jsonschema
        name: check notebook against the nbformat v4 schema
        files: \.ipynb$
        types: [jupyter]
        args:
          - --schemafile=https://raw.githubusercontent.com/jupyter/nbformat/v5.11.1/nbformat/v4/nbformat.v4.schema.json
